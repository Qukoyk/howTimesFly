[project]
name = "howtimesfly"
description = "REST API server for the Divoom Times Gate (5 screens) - FastAPI + Swagger UI."
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "requests>=2.32",
    "pillow>=11.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
